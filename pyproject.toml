[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloomsarchive"
version = "0.3.0"
description = "Bloom's Archive — a custom Jellyfin desktop client that direct-plays through mpv"
readme = "README.md"
requires-python = ">=3.10"
# The API layer is standard-library only; Qt is needed for the GUI.
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
keyring = ["keyring>=24"]
test = ["pytest>=7"]

[project.scripts]
bloomsarchive = "bloomsarchive.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bloomsarchive = ["mpv_assets/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
